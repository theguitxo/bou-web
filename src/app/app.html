@if(isLoading()) {
<div class="main-container">
    <div class="logo-bou">
        <img src="img/logo_bou_blanco.svg" />
    </div>
    <div class="font-luciestguy loader-progress">
        <h3 class="loading-txt">{{ 'TXT.LOADING_IMAGES' | translate }}</h3>
        <app-progress-bar [value]="loadProgress()" />
        <h3>{{ loadProgress() | number:'1.0-0' }}%</h3>
    </div>
</div>
}

@if(!isLoading()) {
<router-outlet id="main-content" />
}
